    <script>
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var _currentFetch = originalFetch;

          // Define getter + setter on window so `window.fetch = ...` never throws TypeError
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _currentFetch;
              },
              set: function(val) {
                _currentFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            try {
              Object.defineProperty(window, 'fetch', {
                value: originalFetch,
                writable: true,
                configurable: true,
                enumerable: true
              });
            } catch (e2) {}
          }

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return _currentFetch;
                },
                set: function(val) {
                  _currentFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e3) {}
          }
        } catch (err) {
          console.warn('Polyfill for window.fetch initialized with warning:', err);
        }
      })();
    </script>
